<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solana.Memory - Loading...</title>
    <link rel="icon" href="https://i.ibb.co/4Z5vM0Z/doodle-heart.png">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .loading-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            z-index: 9999;
        }

        .loading-spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            margin-top: 20px;
            font-size: 1.2rem;
            font-weight: 500;
        }

        .error-container {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            justify-content: center;
            align-items: center;
            background: #1a1a1a;
            color: white;
            text-align: center;
            padding: 2rem;
            z-index: 9998;
        }

        .error-content h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
            color: #ef4444;
        }

        .error-content p {
            font-size: 1.2rem;
            margin-bottom: 2rem;
            color: #a3a3a3;
        }

        .error-content a {
            display: inline-block;
            padding: 1rem 2rem;
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            transition: transform 0.2s;
        }

        .error-content a:hover {
            transform: translateY(-2px);
        }

        #effectContainer {
            display: none;
            width: 100%;
            min-height: 100vh;
        }
    </style>
</head>
<body>
    <div class="loading-container" id="loadingContainer">
        <div class="loading-spinner"></div>
        <p class="loading-text">Đang tải...</p>
    </div>

    <div class="error-container" id="errorContainer">
        <div class="error-content">
            <h1>404</h1>
            <p>Không tìm thấy sản phẩm này.</p>
            <a href="/">Quay về trang chủ</a>
        </div>
    </div>

    <div id="effectContainer"></div>

    <script type="module" src="/product.tsx"></script>
</body>
</html>
