<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elegant Memories</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Playfair Display', serif;
            background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
            min-height: 100vh;
            padding: 2rem;
        }
        .container {
            max-width: 950px;
            margin: 0 auto;
            background: #fff;
            border: 1px solid #d4af37;
            box-shadow: 0 0 0 10px rgba(212, 175, 55, 0.1);
        }
        .header {
            text-align: center;
            padding: 3rem 2rem;
            background: linear-gradient(135deg, #d4af37, #f4d03f);
            color: #2c3e50;
            position: relative;
        }
        .header::after {
            content: '';
            position: absolute;
            bottom: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-top: 20px solid #f4d03f;
        }
        .header h1 {
            font-size: 2.8rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }
        .subtitle {
            font-size: 1.1rem;
            font-weight: 400;
            font-style: italic;
        }
        .gallery {
            padding: 4rem 2rem 2rem;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 2rem;
        }
        .photo-card {
            border: 5px solid #d4af37;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: transform 0.3s ease;
        }
        .photo-card:hover {
            transform: scale(1.03);
        }
        .photo-card img {
            width: 100%;
            height: 280px;
            object-fit: cover;
            display: block;
        }
        .photo-caption {
            padding: 1.2rem;
            background: #2c3e50;
        }
        .photo-caption h3 {
            color: #d4af37;
            font-size: 1.1rem;
            margin-bottom: 0.4rem;
        }
        .photo-caption p {
            color: #ecf0f1;
            font-size: 0.9rem;
            font-family: 'Arial', sans-serif;
        }
        .message-box {
            margin: 2rem;
            padding: 2.5rem;
            background: #f8f9fa;
            border-left: 5px solid #d4af37;
            border-right: 5px solid #d4af37;
        }
        .message-box h2 {
            color: #2c3e50;
            font-size: 2rem;
            margin-bottom: 1.5rem;
            text-align: center;
        }
        .message-box p {
            color: #555;
            line-height: 2;
            font-size: 1.1rem;
            text-align: justify;
            font-family: 'Georgia', serif;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>👑 {recipientName} 👑</h1>
            <p class="subtitle">~ {productName} ~</p>
        </div>
        <div class="gallery" id="gallery">
            <!-- Photos will be inserted here -->
        </div>
        <div class="message-box">
            <h2>💎 Lời Nhắn Đặc Biệt</h2>
            <p>{message}</p>
        </div>
    </div>
</body>
</html>
