<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nostalgic Memories</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Courier New', monospace;
            background: #f4e8d8;
            min-height: 100vh;
            padding: 2rem;
        }
        .container {
            max-width: 850px;
            margin: 0 auto;
            background: #faf5ee;
            border: 2px solid #8b7355;
            box-shadow: 0 15px 40px rgba(139, 115, 85, 0.3);
        }
        .header {
            text-align: center;
            padding: 2.5rem 2rem;
            background: #e6d5c3;
            border-bottom: 3px double #8b7355;
        }
        .header h1 {
            color: #5d4e37;
            font-size: 2.3rem;
            margin-bottom: 0.5rem;
            font-family: 'Times New Roman', serif;
            text-transform: uppercase;
        }
        .subtitle {
            color: #8b7355;
            font-size: 1rem;
            font-style: italic;
        }
        .gallery {
            padding: 2rem;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 2rem;
        }
        .photo-card {
            background: #fff;
            padding: 0.8rem;
            border: 1px solid #d4c5b0;
            box-shadow: 5px 5px 15px rgba(0,0,0,0.15);
            transform: rotate(-1deg);
        }
        .photo-card:nth-child(even) {
            transform: rotate(1deg);
        }
        .photo-card img {
            width: 100%;
            height: 240px;
            object-fit: cover;
            filter: sepia(30%) contrast(90%);
            border: 2px solid #d4c5b0;
        }
        .photo-caption {
            padding: 1rem 0.5rem 0.5rem;
            text-align: center;
        }
        .photo-caption h3 {
            color: #5d4e37;
            font-size: 0.95rem;
            margin-bottom: 0.3rem;
            font-family: 'Times New Roman', serif;
        }
        .photo-caption p {
            color: #8b7355;
            font-size: 0.8rem;
        }
        .message-box {
            margin: 2rem;
            padding: 2rem;
            background: #fff;
            border: 2px dashed #8b7355;
        }
        .message-box h2 {
            color: #5d4e37;
            font-size: 1.5rem;
            margin-bottom: 1rem;
            text-align: center;
            font-family: 'Times New Roman', serif;
            text-transform: uppercase;
        }
        .message-box p {
            color: #555;
            line-height: 1.9;
            font-size: 1rem;
            text-align: justify;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📜 {recipientName}</h1>
            <p class="subtitle">~ {productName} ~</p>
        </div>
        <div class="gallery" id="gallery">
            <!-- Photos will be inserted here -->
        </div>
        <div class="message-box">
            <h2>✉️ Lời Nhắn</h2>
            <p>{message}</p>
        </div>
    </div>
</body>
</html>
