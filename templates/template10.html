<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luxury Memories</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Didot', 'Bodoni MT', 'Times New Roman', serif;
            background: #000;
            min-height: 100vh;
            padding: 3rem 1rem;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            border: 2px solid #d4af37;
            box-shadow: 0 0 50px rgba(212, 175, 55, 0.5);
        }
        .header {
            text-align: center;
            padding: 4rem 2rem;
            background: linear-gradient(135deg, #d4af37, #f8e58c, #d4af37);
            position: relative;
        }
        .header::before, .header::after {
            content: '✨';
            position: absolute;
            font-size: 3rem;
            top: 1rem;
            animation: sparkle 2s ease-in-out infinite;
        }
        .header::before {
            left: 2rem;
        }
        .header::after {
            right: 2rem;
        }
        @keyframes sparkle {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        .header h1 {
            color: #1a1a1a;
            font-size: 3.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            letter-spacing: 3px;
            text-transform: uppercase;
        }
        .subtitle {
            color: #2d2d2d;
            font-size: 1.3rem;
            font-style: italic;
            letter-spacing: 2px;
        }
        .gallery {
            padding: 4rem 3rem;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2.5rem;
        }
        .photo-card {
            position: relative;
            border: 3px solid #d4af37;
            box-shadow: 0 15px 45px rgba(212, 175, 55, 0.4);
            transition: all 0.4s ease;
        }
        .photo-card:hover {
            box-shadow: 0 25px 60px rgba(212, 175, 55, 0.6);
            transform: translateY(-10px);
        }
        .photo-card img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            display: block;
        }
        .photo-caption {
            padding: 1.5rem;
            background: linear-gradient(135deg, #2d2d2d, #1a1a1a);
            border-top: 2px solid #d4af37;
        }
        .photo-caption h3 {
            color: #d4af37;
            font-size: 1.2rem;
            margin-bottom: 0.5rem;
            letter-spacing: 1px;
        }
        .photo-caption p {
            color: #ccc;
            font-size: 0.9rem;
            font-family: 'Arial', sans-serif;
        }
        .message-box {
            margin: 3rem;
            padding: 3rem;
            background: linear-gradient(135deg, #1a1a1a, #2d2d2d);
            border: 3px solid #d4af37;
            box-shadow: inset 0 0 30px rgba(212, 175, 55, 0.2);
        }
        .message-box h2 {
            color: #d4af37;
            font-size: 2.5rem;
            margin-bottom: 2rem;
            text-align: center;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .message-box p {
            color: #e0e0e0;
            line-height: 2;
            font-size: 1.2rem;
            text-align: center;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>💎 {recipientName} 💎</h1>
            <p class="subtitle">~ {productName} ~</p>
        </div>
        <div class="gallery" id="gallery">
            <!-- Photos will be inserted here -->
        </div>
        <div class="message-box">
            <h2>👑 Lời Nhắn Sang Trọng</h2>
            <p>{message}</p>
        </div>
    </div>
</body>
</html>
