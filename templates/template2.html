<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Memory</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Arial', sans-serif;
            background: #0f0f0f;
            color: #fff;
            min-height: 100vh;
            padding: 2rem;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            margin-bottom: 4rem;
        }
        .header h1 {
            font-size: 3rem;
            font-weight: 300;
            letter-spacing: 2px;
            background: linear-gradient(45deg, #00f2fe, #4facfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .subtitle {
            color: #888;
            font-size: 1rem;
            margin-top: 1rem;
            letter-spacing: 1px;
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.5rem;
            margin-bottom: 4rem;
        }
        .photo-card {
            position: relative;
            overflow: hidden;
            border-radius: 8px;
            aspect-ratio: 4/3;
        }
        .photo-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(30%);
            transition: all 0.4s ease;
        }
        .photo-card:hover img {
            filter: grayscale(0%);
            transform: scale(1.05);
        }
        .photo-caption {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(transparent, rgba(0,0,0,0.9));
            padding: 2rem 1.5rem 1.5rem;
            transform: translateY(100%);
            transition: transform 0.3s ease;
        }
        .photo-card:hover .photo-caption {
            transform: translateY(0);
        }
        .photo-caption h3 {
            color: #4facfe;
            font-size: 1.1rem;
            margin-bottom: 0.3rem;
        }
        .photo-caption p {
            color: #ccc;
            font-size: 0.85rem;
        }
        .message-box {
            background: #1a1a1a;
            padding: 3rem;
            border-radius: 8px;
            border: 1px solid #333;
        }
        .message-box h2 {
            color: #4facfe;
            font-size: 1.5rem;
            font-weight: 300;
            margin-bottom: 1.5rem;
        }
        .message-box p {
            color: #ccc;
            line-height: 2;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌟 {recipientName}</h1>
            <p class="subtitle">{productName}</p>
        </div>
        <div class="gallery" id="gallery">
            <!-- Photos will be inserted here -->
        </div>
        <div class="message-box">
            <h2>Message</h2>
            <p>{message}</p>
        </div>
    </div>
</body>
</html>
