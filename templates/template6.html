<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colorful Memories</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Comic Sans MS', 'Arial', sans-serif;
            background: linear-gradient(45deg, #ff6b6b, #ee5a6f, #c44569, #786fa6, #4b7bec, #3867d6);
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
            min-height: 100vh;
            padding: 2rem;
        }
        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #fff;
            border-radius: 25px;
            padding: 2.5rem;
            box-shadow: 0 25px 70px rgba(0,0,0,0.4);
        }
        .header {
            text-align: center;
            margin-bottom: 2.5rem;
            padding: 2rem;
            background: linear-gradient(135deg, #ffafbd, #ffc3a0);
            border-radius: 20px;
        }
        .header h1 {
            font-size: 2.5rem;
            background: linear-gradient(45deg, #ff6b6b, #4b7bec, #26de81);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
        }
        .subtitle {
            color: #ff6b6b;
            font-size: 1.1rem;
            font-weight: bold;
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 2rem;
            margin-bottom: 2.5rem;
        }
        .photo-card {
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            border: 4px solid;
            animation: borderColor 5s ease infinite;
        }
        @keyframes borderColor {
            0% { border-color: #ff6b6b; }
            25% { border-color: #4b7bec; }
            50% { border-color: #26de81; }
            75% { border-color: #fed330; }
            100% { border-color: #ff6b6b; }
        }
        .photo-card img {
            width: 100%;
            height: 240px;
            object-fit: cover;
            transition: transform 0.3s ease;
        }
        .photo-card:hover img {
            transform: scale(1.1);
        }
        .photo-caption {
            padding: 1rem;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }
        .photo-caption h3 {
            color: #fff;
            font-size: 1rem;
            margin-bottom: 0.4rem;
        }
        .photo-caption p {
            color: #f0f0f0;
            font-size: 0.85rem;
        }
        .message-box {
            background: linear-gradient(135deg, #a8edea, #fed6e3);
            padding: 2.5rem;
            border-radius: 20px;
            border: 4px solid #ff6b6b;
        }
        .message-box h2 {
            color: #c44569;
            font-size: 2rem;
            margin-bottom: 1rem;
            text-align: center;
        }
        .message-box p {
            color: #333;
            line-height: 1.8;
            font-size: 1.05rem;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌈 {recipientName} 🌈</h1>
            <p class="subtitle">🎨 {productName} 🎨</p>
        </div>
        <div class="gallery" id="gallery">
            <!-- Photos will be inserted here -->
        </div>
        <div class="message-box">
            <h2>🎉 Lời Nhắn Vui Vẻ</h2>
            <p>{message}</p>
        </div>
    </div>
</body>
</html>
