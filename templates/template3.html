<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Romantic Memories</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Cursive', 'Comic Sans MS', sans-serif;
            background: linear-gradient(to bottom, #ffecd2 0%, #fcb69f 100%);
            min-height: 100vh;
            padding: 2rem;
        }
        .container {
            max-width: 850px;
            margin: 0 auto;
            background: #fff;
            border-radius: 30px;
            padding: 2.5rem;
            box-shadow: 0 15px 50px rgba(252, 182, 159, 0.4);
        }
        .header {
            text-align: center;
            margin-bottom: 2.5rem;
            position: relative;
        }
        .header::before, .header::after {
            content: '💕';
            position: absolute;
            font-size: 3rem;
            top: -10px;
        }
        .header::before {
            left: 10px;
        }
        .header::after {
            right: 10px;
        }
        .header h1 {
            color: #ff6b9d;
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            text-shadow: 2px 2px 4px rgba(255, 107, 157, 0.2);
        }
        .subtitle {
            color: #c44569;
            font-size: 1.1rem;
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2.5rem;
        }
        .photo-card {
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(255, 107, 157, 0.3);
            border: 3px solid #ffeaa7;
            transform: rotate(-2deg);
            transition: all 0.3s ease;
        }
        .photo-card:nth-child(even) {
            transform: rotate(2deg);
        }
        .photo-card:hover {
            transform: rotate(0deg) scale(1.05);
        }
        .photo-card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
        }
        .photo-caption {
            padding: 1rem;
            background: linear-gradient(135deg, #ffeaa7, #ffcccc);
        }
        .photo-caption h3 {
            color: #c44569;
            font-size: 1rem;
            margin-bottom: 0.4rem;
        }
        .photo-caption p {
            color: #666;
            font-size: 0.85rem;
        }
        .message-box {
            background: linear-gradient(135deg, #fff1f1, #ffe4e4);
            padding: 2rem;
            border-radius: 20px;
            border: 3px dashed #ff6b9d;
            position: relative;
        }
        .message-box::before {
            content: '💝';
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 2.5rem;
            background: #fff;
            padding: 0 1rem;
        }
        .message-box h2 {
            color: #ff6b9d;
            text-align: center;
            margin-bottom: 1rem;
            font-size: 1.8rem;
        }
        .message-box p {
            color: #555;
            line-height: 1.8;
            font-size: 1.05rem;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>💖 {recipientName} 💖</h1>
            <p class="subtitle">✨ {productName} ✨</p>
        </div>
        <div class="gallery" id="gallery">
            <!-- Photos will be inserted here -->
        </div>
        <div class="message-box">
            <h2>💌 Lời Yêu Thương</h2>
            <p>{message}</p>
        </div>
    </div>
</body>
</html>
