<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playful Memories</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Comic Sans MS', 'Arial Rounded MT Bold', sans-serif;
            background: linear-gradient(45deg, #84fab0 0%, #8fd3f4 100%);
            min-height: 100vh;
            padding: 2rem;
        }
        .container {
            max-width: 880px;
            margin: 0 auto;
            background: #fff;
            border-radius: 35px;
            padding: 2rem;
            box-shadow: 0 20px 60px rgba(0,0,0,0.25);
            border: 6px solid #fff;
            outline: 4px dashed #84fab0;
        }
        .header {
            text-align: center;
            margin-bottom: 2.5rem;
            padding: 2rem;
            background: linear-gradient(135deg, #ffd89b, #19547b);
            border-radius: 25px;
            transform: rotate(-1deg);
        }
        .header h1 {
            color: #fff;
            font-size: 2.8rem;
            margin-bottom: 0.5rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            transform: rotate(1deg);
        }
        .subtitle {
            color: rgba(255,255,255,0.95);
            font-size: 1.2rem;
            font-weight: bold;
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 2rem;
            margin-bottom: 2.5rem;
        }
        .photo-card {
            border-radius: 25px;
            overflow: hidden;
            box-shadow: 8px 8px 0px #84fab0;
            border: 4px solid #19547b;
            transform: rotate(-3deg);
            transition: all 0.3s ease;
        }
        .photo-card:nth-child(even) {
            transform: rotate(3deg);
            box-shadow: -8px 8px 0px #ffd89b;
        }
        .photo-card:hover {
            transform: rotate(0deg) translateY(-10px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }
        .photo-card img {
            width: 100%;
            height: 230px;
            object-fit: cover;
        }
        .photo-caption {
            padding: 1rem;
            background: #19547b;
        }
        .photo-caption h3 {
            color: #ffd89b;
            font-size: 1rem;
            margin-bottom: 0.4rem;
        }
        .photo-caption p {
            color: #fff;
            font-size: 0.85rem;
        }
        .message-box {
            background: linear-gradient(135deg, #f093fb, #f5576c);
            padding: 2.5rem;
            border-radius: 25px;
            border: 5px solid #fff;
            box-shadow: 8px 8px 0px #84fab0;
        }
        .message-box h2 {
            color: #fff;
            font-size: 2.2rem;
            margin-bottom: 1rem;
            text-align: center;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }
        .message-box p {
            color: #fff;
            line-height: 1.8;
            font-size: 1.1rem;
            text-align: center;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎈 {recipientName} 🎈</h1>
            <p class="subtitle">🎪 {productName} 🎪</p>
        </div>
        <div class="gallery" id="gallery">
            <!-- Photos will be inserted here -->
        </div>
        <div class="message-box">
            <h2>🎁 Lời Nhắn Vui Nhộn</h2>
            <p>{message}</p>
        </div>
    </div>
</body>
</html>
