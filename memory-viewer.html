<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kỷ Niệm Của Chúng Ta</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="memory-viewer.css">
    <link rel="icon" href="https://i.ibb.co/4Z5vM0Z/doodle-heart.png">
    <!-- Load Firebase v8 SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
</head>
<body>
    <div class="container">
        <div id="loadingState" class="loading-state">
            <div class="spinner"></div>
            <p class="loading-text">Đang tải kỷ niệm...</p>
        </div>

        <div id="errorState" class="error-state" style="display: none;">
            <h1 class="error-title">Kỷ niệm không tìm thấy 💔</h1>
            <p class="error-message">Có vẻ như kỷ niệm này không tồn tại hoặc đã bị xóa.</p>
            <a href="/" class="back-home-btn">Về trang chủ</a>
        </div>

        <div id="memoryContent" class="card" style="display: none;">
            <div class="header">
                <h1 id="recipientName"></h1>
                <p class="product-info">Sản phẩm: <strong id="productName"></strong></p>
            </div>
            
            <div class="message-box">
                <p id="messageContent"></p>
            </div>

            <div class="image-gallery" id="imageGallery">
                <!-- Images will be loaded here by JavaScript -->
            </div>
            <p class="image-info" id="imageFileName"></p>
            <span class="timestamp">Được tạo vào: <span id="timestamp"></span></span>
            <a href="/" class="back-home-btn">Tạo kỷ niệm của riêng bạn!</a>
        </div>
    </div>
    
    <script type="module" src="memory-viewer.tsx"></script>
</body>
</html>
